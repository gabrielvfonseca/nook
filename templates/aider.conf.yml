# Replica Integration for Aider

## Overview
Replica provides fast, isolated workspaces using macOS APFS clonefile technology.

## When to Use Replica
- Clean project state for each coding task
- Parallel Aider sessions
- Fast workspace creation (< 100ms)
- Disk efficiency via copy-on-write

## Quick Start
```bash
cd $(replica new --ttl 2h)
aider
```

## Key Commands
- `replica new [--ttl 2h] [--name label]` - Create workspace
- `replica env <id>` - Environment exports
- `replica list` - List workspaces
- `replica gc` - Cleanup
- `replica stats` - Disk usage

## Configuration
```bash
export REPLICA_ROOT=/Volumes/Work/replica
```

## Workflow
1. `replica base build --repo <url> --setup "make deps"` (once)
2. `cd $(replica new)` - Ready to code
3. Auto-cleanup via TTL/GC

## Tips
- Shared caches in `$REPLICA_ROOT/cache`
- `replica touch <id>` prevents eviction
- `--require-fresh` ensures base currency

