[package]
name = "nook"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fast because it refuses to do the work. APFS clonefile workspace manager for agent workloads."
license = "MIT"
readme = "README.md"
keywords = ["apfs", "clonefile", "macos", "agents", "workspace"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "nook"
path = "src/lib.rs"

[[bin]]
name = "nook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
